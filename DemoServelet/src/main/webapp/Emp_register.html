<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee register</title>
</head>
<body>
<h2> Employee registration</h2>
<form action="registerEmp" method="post">
    <label>
        <input type="text" name="emp_id" placeholder="id"><br><br>
        <input type="text" name="emp_name" placeholder="Name"><br><br>
        <input type="text" name="emp_email" placeholder="Email"><br><br>
        <input type="text" name="emp_department" placeholder="Department"><br><br>
        <input type="password" name="emp_password" placeholder="Password"><br><br>
    </label>
    <button type="submit">registered</button>
</form>

</body>
</html>
